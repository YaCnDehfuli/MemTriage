<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>MemTriage — Memory Forensics Triage</title>
    <script>
      // Applied before first paint so there is no flash of the wrong theme.
      (function () {
        var stored = localStorage.getItem("memtriage-theme");
        var dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
    <meta
      name="description"
      content="Upload a memory image, triage it with an explainable detection engine, and deep-dive a process with VADViT."
    />
    <link
      rel="icon"

      rel="stylesheet"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
